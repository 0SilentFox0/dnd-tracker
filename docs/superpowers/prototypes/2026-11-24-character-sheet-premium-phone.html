<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Лист персонажа — телефон</title>
<style>
  body { margin: 0; background: #3a3632; display: flex; gap: 24px; padding: 0; align-items: flex-start; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 0; flex: none; }
</style>
</head>
<body>
<iframe src="2026-11-24-character-sheet-premium.html?palette=tavern"></iframe>
<iframe src="2026-11-24-character-sheet-premium.html?palette=parchment"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("h")) document.querySelectorAll("iframe").forEach(f => f.style.height = q.get("h") + "px");
  if (q.get("only")) document.querySelectorAll("iframe").forEach(f => { if (!f.src.includes(q.get("only"))) f.remove(); });
  if (q.get("tab")) document.querySelectorAll("iframe").forEach(f => f.src += "&tab=" + q.get("tab"));
</script>
</body>
</html>
